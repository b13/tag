name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        TYPO3: [ '13', '14' ]
        php: [ '8.2', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: dependencies-composer-${{ hashFiles('composer.json') }}

      - name: Install composer dependencies TYPO3 14
        if: matrix.TYPO3 == '14'
        run: |
          composer install --no-progress --no-interaction
      - name: Install composer dependencies TYPO3 13
        if: matrix.TYPO3 == '13'
        run: |
          composer require typo3/cms-core:^13.4 --no-progress --no-interaction --dev -W
      - name: Phpstan
        run: vendor/bin/phpstan analyze -c phpstan.neon
      - name: Phpcsfix
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --stop-on-violation --using-cache=no
